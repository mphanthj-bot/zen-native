# Đã verify live 2026-10-02 với codex-cli 0.157.1.
# Thêm vào ~/.codex/config.toml (giữ nguyên phần còn lại):

[model_providers.zen-native]
name = "zen-native gateway"
base_url = "http://127.0.0.1:8080/v1"
env_key = "OPENCODE2API_KEY"
wire_api = "responses"

# Test không đổi default (thêm -c override):
