# Codex CLI native vào Zen (Responses protocol, không qua trung gian).
# File: ~/.codex/config.toml  (merge đoạn này vào)
model = "gpt-5.3-codex"
model_provider = "zen"

[model_providers.zen]
name = "OpenCode Zen"
base_url = "https://opencode.ai/zen/v1/responses"
# Zen dùng Bearer public cho lane free + fingerprint headers.
# Codex tự gửi UA của nó; nếu free lane từ chối, thêm vào request
# các header sau (xem recipe/HEADERS.md):
#   Authorization: Bearer public
#   x-opencode-client: cli
env_key = "OPENCODE_ZEN_KEY"
